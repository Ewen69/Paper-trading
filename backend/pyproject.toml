[project]
name = "ptl"
version = "0.0.1"
description = "Paper Trading Lab backend (paper trading only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "alpaca-py>=0.40",
    "exchange-calendars>=4.5",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-requests>=2.33.0.20260906",
]

[project.scripts]
ptl = "ptl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptl"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN", "PT", "DTZ", "T20", "C4", "PL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Untyped; all use is contained in ptl/market_calendar.py.
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Third-party: alpaca-py's (unused here) streaming module imports websockets.legacy.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
